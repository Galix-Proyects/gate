<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Purificadora Pro</title>
<meta name="theme-color" content="#22c55e">
<style>
body,html{margin:0;padding:0;width:100%;height:100%;background:#020617;display:flex;align-items:center;justify-content:center;flex-direction:column;font-family:sans-serif;color:#fff;}
.loader{width:40px;height:40px;border:3px solid rgba(255,255,255,0.05);border-top:3px solid #22c55e;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:20px;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div class="loader"></div>
<p>Redirigiendo...</p>
<script>
(async function(){
  try{
    const r=await fetch("../tunnel.json?t="+Date.now());
    const d=await r.json();
    window.location.replace(d.url.replace(/\/$/,"")+"/Purificadora/");
  }catch(e){
    document.body.innerHTML="<p style=\"color:#ef4444;\">Error de conexion. Verifica que el servidor este encendido.</p>";
  }
})();
</script>
</body>
</html>
