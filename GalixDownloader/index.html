<!DOCTYPE html><html lang='es'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover'><title>GalixDownloader Pro</title><meta name='theme-color' content='#7c3aed'><link rel='manifest' href='manifest.json?v=2.2'><link rel='icon' href='../logo.png?v=2.2'><link rel='apple-touch-icon' href='../icons/GalixDownloader.png?v=2.2'><style>:root { --accent: #7c3aed; --bg: #020617; } body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg); font-family: sans-serif; } #splash { position: fixed; inset: 0; z-index: 9999; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.8s; } .loader { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.05); border-top: 3px solid var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 20px; } @keyframes spin { to { transform: rotate(360deg); } } iframe { width: 100%; height: 100%; border: none; display: none; }</style></head><body><div id='splash'><img src='../icons/GalixDownloader.png?v=2.2' onerror="this.src='../logo.png?v=2.2'" style='width:80px; height:80px; border-radius:20px; margin-bottom:20px;'><div class='loader'></div></div><iframe id='frame'></iframe><script>let currentTunnel='';async function checkTunnel(){try{const res=await fetch('../tunnel.json?t='+Date.now());const content=await res.json();if(!currentTunnel){currentTunnel=content.url;renderFrame(currentTunnel)}else if(currentTunnel!==content.url){window.location.reload()}}catch(e){console.error(e)}}function renderFrame(tunnelUrl){const frame=document.getElementById('frame');frame.src=tunnelUrl.replace(/\/$/,'')+'/01_PROYECTOS/GalixDownloader/'+window.location.search;frame.onload=()=>{document.getElementById('splash').style.opacity='0';setTimeout(()=>{document.getElementById('splash').style.display='none';frame.style.display='block'},800)}};checkTunnel();setInterval(checkTunnel,60000);</script></body></html>
