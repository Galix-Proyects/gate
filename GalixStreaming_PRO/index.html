<!DOCTYPE html><html lang='es'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover'><title>GalixStreaming_PRO Pro</title><meta name='theme-color' content='#22c55e'><link rel='manifest' href='manifest.json?v=2.3'><link rel='icon' href='../logo.png?v=2.3'><link rel='apple-touch-icon' href='../icons/GalixStreaming_PRO.png?v=2.3'><style>:root { --accent: #22c55e; --bg: #020617; } body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg); font-family: sans-serif; } #splash { position: fixed; inset: 0; z-index: 9999; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.8s; } .loader { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.05); border-top: 3px solid var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 20px; } @keyframes spin { to { transform: rotate(360deg); } } iframe { width: 100%; height: 100%; border: none; display: none; }</style></head><body><div id='splash'><img src='../icons/GalixStreaming_PRO.png?v=2.3' onerror="this.src='../logo.png?v=2.3'" style='width:80px; height:80px; border-radius:20px; margin-bottom:20px;'><div class='loader'></div></div><iframe id='frame'></iframe><script>let currentTunnel='';let retryCount=0;async function checkTunnel(){try{const res=await fetch('../tunnel.json?t='+Date.now());const content=await res.json();const tunnelUrl=content.url||'';const fallback=content.fallback||'';if(!currentTunnel){currentTunnel=tunnelUrl;renderFrame(tunnelUrl,fallback)}else if(currentTunnel!==tunnelUrl){console.log('Tunnel URL changed, updating iframe');retryCount=0;currentTunnel=tunnelUrl;renderFrame(tunnelUrl,fallback)}}catch(e){console.error(e)}}function renderFrame(tunnelUrl,fallback){const frame=document.getElementById('frame');const splash=document.getElementById('splash');const path='/GalixStreaming_PRO/'+window.location.search;const timeout=setTimeout(()=>{retryCount++;if(retryCount<3){splash.innerHTML='<div style="color:#64748b;font-size:0.9rem;">Reconectando... ('+retryCount+'/3)</div>';frame.src=tunnelUrl.replace(/\/$/,'')+path}else if(fallback){splash.innerHTML='<div style="color:#f59e0b;font-size:0.9rem;">Usando fallback local...</div>';frame.src=fallback.replace(/\/$/,'')+path}else{splash.innerHTML='<div style="color:#ef4444;font-size:1rem;">Servidor no disponible</div>'}},15000);frame.src=tunnelUrl.replace(/\/$/,'')+path;frame.onload=()=>{clearTimeout(timeout);splash.style.opacity='0';setTimeout(()=>{splash.style.display='none';frame.style.display='block'},800)};frame.onerror=()=>{clearTimeout(timeout);retryCount++;if(retryCount<3){setTimeout(()=>renderFrame(tunnelUrl,fallback),3000)}}};checkTunnel();setInterval(checkTunnel,60000);</script></body></html>
