        <div class="brand" style="cursor: pointer;" onclick="(async () => { 
            if ('serviceWorker' in navigator) {
                const regs = await navigator.serviceWorker.getRegistrations();
                for(let reg of regs) { await reg.unregister(); }
            }
            if ('caches' in window) {
                const keys = await caches.keys();
                for(let key of keys) { await caches.delete(key); }
            }
            window.location.href = window.location.pathname + '?refresh=' + Date.now();
        })()" title="Hard Refresh / Limpieza Profunda">GALIX<span style="color:white;">MOVIE</span></div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js?v=5.3')
                .then(reg => {
                    console.log('[SW] GalixMovie Service Worker v5.3 registrado');
                    // Auto-reload cuando hay una nueva versión del SW instalada
                    reg.addEventListener('updatefound', () => {
                        const newSW = reg.installing;
                        newSW.addEventListener('statechange', () => {
                            if (newSW.state === 'activated' && navigator.serviceWorker.controller) {
                                console.log('[SW] Nueva versión activa — recargando...');
                                window.location.reload();
                            }
                        });
                    });
                })
                .catch(err => console.warn('[SW] Error:', err));
        }


        // 🖥️ MEJORA 2 FIX: Scroll horizontal inteligente y ultra-veloz en PC/Mac (Mouse y Trackpad)
        window.initGridScrolling = function(grid) {
            if (!grid || grid.dataset.scrollingInit) return;
            grid.dataset.scrollingInit = "true";

            // 1) REDIRECCIÓN DE RUEDA (MOUSE / TRACKPAD)
            grid.addEventListener('wheel', (e) => {
                const canScrollH = grid.scrollWidth > grid.clientWidth + 1;
                if (!canScrollH) return;

                // Si hay deltaX (trackpad) se usa deltaX; si no, se redirige deltaY (rueda de mouse)
                const delta = e.deltaX || e.deltaY;
                if (!delta) return;

                const canScrollLeft = grid.scrollLeft > 0;
                const canScrollRight = grid.scrollLeft < (grid.scrollWidth - grid.clientWidth - 1);

                // Smart Escape: Solo interceptar si el carrusel puede avanzar en esa dirección
                if ((delta > 0 && canScrollRight) || (delta < 0 && canScrollLeft)) {
                    e.preventDefault();
                    grid.scrollLeft += delta * 1.5; // Rapidez incrementada a 1.5x
                }
            }, { passive: false });

            // 2) DESPLAZAMIENTO POR ARRASTRE DE MOUSE (DRAG-TO-SCROLL)
            let isDown = false;
            let startX;
            let scrollLeft;

            grid.addEventListener('mousedown', (e) => {
                isDown = true;
                startX = e.pageX - grid.offsetLeft;
                scrollLeft = grid.scrollLeft;
            });

            grid.addEventListener('mouseleave', () => {
                isDown = false;
                grid.classList.remove('grabbing');
            });

            grid.addEventListener('mouseup', () => {
                isDown = false;
                grid.classList.remove('grabbing');
            });

            grid.addEventListener('mousemove', (e) => {
                if (!isDown) return;
                const x = e.pageX - grid.offsetLeft;
                const dist = x - startX;
                
                // Solo considerarlo arrastre (drag) si se mueve más de 5 píxeles
                if (Math.abs(dist) > 5) {
                    grid.classList.add('grabbing');
                    e.preventDefault();
                    const walk = dist * 1.8; // Velocidad de arrastre de 1.8x
                    grid.scrollLeft = scrollLeft - walk;
                }
            });
        };

        // Inicializar los grids existentes en la carga
        document.querySelectorAll('.movie-grid').forEach(grid => window.initGridScrolling(grid));
    </script>
</body>
</html>
