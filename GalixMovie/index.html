<!DOCTYPE html><html lang='es'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover'><title>GalixMovie Pro</title><meta name='theme-color' content='#e11d48'><link rel='manifest' href='manifest.json?v=2.2'><link rel='icon' href='../logo.png?v=2.2'><link rel='apple-touch-icon' href='../icons/GalixMovie.png?v=2.2'><style>
:root { --accent: #e11d48; --bg: #020617; }
body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg); font-family: sans-serif; }

/* 🛡️ DHARMA: Intro Cinemática — Letras rebotando */
#galix-intro {
  position: fixed; inset: 0; z-index: 99999;
  background: #000;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  transition: opacity 1s ease-in-out;
}
#galix-intro.hidden { opacity: 0; pointer-events: none; }
.intro-text {
  display: flex; gap: 2px;
  font-size: clamp(2.5rem, 10vw, 6rem);
  font-weight: 900;
  font-family: 'Arial Black', sans-serif;
  letter-spacing: 4px;
}
.intro-text span {
  display: inline-block;
  color: transparent;
  background: linear-gradient(180deg, #b0bec5 0%, #455a64 45%, #1c313a 50%, #90a4ae 55%, #cfd8dc 100%);
  -webkit-background-clip: text; background-clip: text;
  opacity: 0;
  transform: translateY(-200px) scale(0.1);
  animation: letterBounce 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
  text-shadow: 0 5px 20px rgba(0,0,0,0.8);
}
@keyframes letterBounce {
  0%   { transform: translateY(-200px) scale(0.1); opacity: 0; }
  50%  { opacity: 1; }
  70%  { transform: translateY(20px) scale(1.1); opacity: 1; }
  85%  { transform: translateY(-10px) scale(0.95); opacity: 1; }
  100% { transform: translateY(0) scale(1); opacity: 1; }
}
/* Splash original */
#splash { position: fixed; inset: 0; z-index: 9999; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.8s; }
.loader { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.05); border-top: 3px solid var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 20px; }
@keyframes spin { to { transform: rotate(360deg); } }
iframe { width: 100%; height: 100%; border: none; display: none; }
</style></head><body>

<!-- 🛡️ DHARMA: Intro Cinemática Transformers -->
<div id="galix-intro">
  <div class="intro-text">
    <span style="animation-delay:0.1s">G</span>
    <span style="animation-delay:0.2s">A</span>
    <span style="animation-delay:0.3s">L</span>
    <span style="animation-delay:0.4s">I</span>
    <span style="animation-delay:0.5s">X</span>
    <span style="animation-delay:0.6s">M</span>
    <span style="animation-delay:0.7s">O</span>
    <span style="animation-delay:0.8s">V</span>
    <span style="animation-delay:0.9s">I</span>
    <span style="animation-delay:1.0s">E</span>
  </div>
</div>

<div id='splash' style='display:none'><img src='../icons/GalixMovie.png?v=2.2' onerror="this.src='../logo.png?v=2.2'" style='width:80px; height:80px; border-radius:20px; margin-bottom:20px;'><div class='loader'></div></div>
<iframe id='frame'></iframe>

<script>
// Intro cinemática: 8 segundos con audio
(function() {
  var intro = document.getElementById('galix-intro');
  var audio = new Audio('assets/intro_8s.mp3');
  audio.volume = 0.5;
  audio.play().catch(function(){});
  setTimeout(function() {
    intro.style.opacity = '0';
    setTimeout(function() {
      intro.style.display = 'none';
      document.getElementById('splash').style.display = 'flex';
      checkTunnel();
    }, 1000);
  }, 8000);
})();

let currentTunnel='';
async function checkTunnel(){
  try{
    const res=await fetch('../tunnel.json?t='+Date.now());
    const content=await res.json();
    if(!currentTunnel){currentTunnel=content.url;renderFrame(currentTunnel)}
    else if(currentTunnel!==content.url){window.location.reload()}
  }catch(e){console.error(e)}
}
function renderFrame(tunnelUrl){
  const frame=document.getElementById('frame');
  frame.src=tunnelUrl.replace(/\/$/,'')+'/GalixMovie/'+window.location.search;
  frame.onload=()=>{
    document.getElementById('splash').style.opacity='0';
    setTimeout(()=>{
      document.getElementById('splash').style.display='none';
      frame.style.display='block'
    },800)
  }
}
setInterval(checkTunnel,60000);
</script>
</body></html>
