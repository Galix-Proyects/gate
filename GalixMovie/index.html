<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>GalixMovie</title>
<meta name="theme-color" content="#020617">
<link rel="icon" href="../logo.png">
<style>
  html, body { margin:0; padding:0; height:100%; background:#020617; overflow:hidden; }
  body { display:flex; flex-direction:column; }
  .ribbon { flex:0 0 auto; display:flex; align-items:center; justify-content:center; gap:6px;
            height:26px; background:#111827; color:#94a3b8; border-bottom:1px solid rgba(255,255,255,.07);
            font:500 10.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
            letter-spacing:.2px; white-space:nowrap; overflow:hidden; }
  .ribbon b { color:#e11d48; font-weight:700; }
  #app { flex:1 1 auto; display:block; width:100%; border:0; background:#020617; }
  .fab { position:fixed; right:10px; bottom:70px; z-index:20; display:flex; flex-direction:column; align-items:flex-end; gap:8px; }
  .fab a { display:inline-flex; align-items:center; gap:6px; padding:9px 13px; border-radius:999px;
           background:rgba(15,23,42,.94); border:1px solid rgba(255,255,255,.14); color:#e2e8f0;
           font:600 11.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
           text-decoration:none; box-shadow:0 8px 22px rgba(0,0,0,.55); backdrop-filter:blur(8px); }
  .fab a:active { transform:scale(.97); }
  .fab a.play { background:linear-gradient(135deg,#e11d48,#be123c); border-color:transparent; }
</style>
</head>
<body>
<div class="ribbon">Catálogo en <b>GitHub Pages</b> · para reproducir usa «Reproducir en la Box»</div>

<iframe id="app" src="../01_PROYECTOS/GalixMovie/"
        allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
        allowfullscreen referrerpolicy="no-referrer-when-downgrade"></iframe>

<div class="fab">
  <a class="play" href="http://100.102.226.89:8080/GalixMovie/">▶ Reproducir en la Box</a>
  <a href="http://100.102.226.89:8080/GalixMovie/admin.html">⚙️ Admin</a>
</div>

<script>
(function () {
  var BOX = 'http://100.102.226.89:8080/GalixMovie/';
  var f = document.getElementById('app');

  // El engranaje de la app apunta a "admin.html", que no existe en Pages.
  // Se redirige a la Box (misma sesion) sin tocar el codigo de la app.
  function patch() {
    try {
      var d = f.contentDocument;
      if (!d || d.__galixPatched) return;
      d.__galixPatched = true;
      d.addEventListener('click', function (ev) {
        var a = ev.target && ev.target.closest ? ev.target.closest('a') : null;
        if (!a) return;
        var h = a.getAttribute('href') || '';
        if (/(^|\/)admin\.html(\?|#|$)/.test(h)) {
          ev.preventDefault();
          location.href = BOX + 'admin.html';
        }
      }, true);
      var links = d.querySelectorAll('a[href="admin.html"], a[href$="/admin.html"]');
      for (var i = 0; i < links.length; i++) { links[i].href = BOX + 'admin.html'; }
    } catch (e) { /* otro origen: no aplica */ }
  }

  f.addEventListener('load', patch);
  var n = 0, iv = setInterval(function () { patch(); if (++n > 60) clearInterval(iv); }, 500);
})();
</script>
</body>
</html>
