<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>GalixMovie</title>
<meta name="theme-color" content="#020617">
<link rel="icon" href="../logo.png">
<style>
  html, body { margin:0; padding:0; height:100%; background:#020617; overflow:hidden; }
  #app { display:block; width:100%; height:100%; border:0; background:#020617; }
  .fab { position:fixed; right:14px; bottom:14px; z-index:20; display:flex; gap:8px; }
  .fab a { display:inline-flex; align-items:center; gap:7px; padding:11px 15px; border-radius:999px;
           background:rgba(15,23,42,.94); border:1px solid rgba(255,255,255,.14); color:#e2e8f0;
           font:600 12.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
           text-decoration:none; box-shadow:0 10px 28px rgba(0,0,0,.55); backdrop-filter:blur(8px); }
  .fab a:active { transform:scale(.97); }
  .fab a.play { background:linear-gradient(135deg,#e11d48,#be123c); border-color:transparent; }
</style>
</head>
<body>
<iframe id="app" src="../01_PROYECTOS/GalixMovie/"
        allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
        allowfullscreen referrerpolicy="no-referrer-when-downgrade"></iframe>

<div class="fab">
  <a class="play" href="http://100.102.226.89:8080/GalixMovie/">▶ Reproducir en la Box</a>
  <a href="http://100.102.226.89:8080/GalixMovie/admin.html">⚙️ Admin</a>
</div>
</body>
</html>
