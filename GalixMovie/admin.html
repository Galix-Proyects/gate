  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:#e2e8f0;

  .bar span { display:block; height:100%; width:40%; background:var(--accent); border-radius:999px;

  @keyframes slide { from { transform:translateX(-100%); } to { transform:translateX(250%); } }
  a.btn { display:inline-flex; align-items:center; gap:8px; padding:12px 20px; border-radius:999px;

    text-decoration:none; box-shadow:0 10px 24px rgba(225,29,72,.35); }

  small { display:block; margin-top:16px; font-size:11px; color:#64748b; line-height:1.5; }
