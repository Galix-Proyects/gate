<!DOCTYPE html>
<html lang='es'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover'>
    <title>Symmetry Gate</title>
    
    <meta name='mobile-web-app-capable' content='yes'>
    <meta name='apple-mobile-web-app-capable' content='yes'>
    <meta name='apple-mobile-web-app-status-bar-style' content='black-translucent'>
    <meta name='theme-color' content='#020617'>
    <link id='pwa-manifest' rel='manifest' href='manifest.json'>
    <link id='pwa-icon' rel='apple-touch-icon' href='logo.png'>
    
    <link href='https://fonts.googleapis.com/css2?family=Outfit:wght@400;900&display=swap' rel='stylesheet'>
    
    <style>
        :root { --accent: #22c55e; --bg: #020617; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg); font-family: 'Outfit', sans-serif; }
        #splash { position: fixed; inset: 0; z-index: 9999; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.8s; }
        .loader-netflix { width: 60px; height: 60px; border: 3px solid rgba(255,255,255,0.05); border-top: 3px solid var(--accent); border-radius: 50%; margin-bottom: 20px; animation: spin 0.8s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .brand { font-size: 1.5rem; font-weight: 900; color: #fff; margin-bottom: 5px; }
        .brand span { color: var(--accent); }
        .status { font-size: 0.6rem; color: var(--accent); letter-spacing: 2px; font-weight: 900; text-transform: uppercase; }
        #app-frame { width: 100%; height: 100%; border: none; display: none; }
    </style>
</head>
<body>
    <div id='splash'>
        <div class='brand'>SYMMETRY<span>GATE</span></div>
        <div class='loader-netflix'></div>
        <div id='status' class='status'>CONECTANDO...</div>
    </div>
    <iframe id='app-frame' allow='autoplay; camera; microphone; geolocation; encrypted-media; fullscreen; display-capture'></iframe>

    <script>
        const identities = {
            'CorteUber': { title: 'CorteUber Pro', theme: '#22c55e', icon: 'CorteUber.png' },
            'GalixMovie': { title: 'GalixMovie Premium', theme: '#e11d48', icon: 'GalixMovie.png' },
            'PlanClase': { title: 'PlanClase AI', theme: '#3b82f6', icon: 'PlanClase.png' }
        };

        async function init() {
            let currentPath = window.location.pathname;
            let repoPath = '/gate/';
            let subPath = currentPath.split(repoPath).pop().replace(/^\//, '') || '';
            
            let projectKey = Object.keys(identities).find(k => subPath.includes(k)) || 'Symmetry';
            let id = identities[projectKey] || { title: 'Symmetry Gate', theme: '#22c55e', icon: 'logo.png' };
            
            // Inyectar Identidad para PWA
            document.title = id.title;
            document.getElementById('pwa-icon').href = 'icons/' + id.icon;
            document.querySelector('meta[name="theme-color"]').setAttribute('content', id.theme);
            document.getElementById('status').innerText = 'ABRIENDO ' + id.title.toUpperCase() + '...';

            try {
                
                // 3. Obtener URL del túnel
                const res = await fetch('https://api.github.com/repos/Galix-Proyects/gate/contents/tunnel.json?t=' + Date.now());
                const data = await res.json();
                const content = JSON.parse(atob(data.content));
                let tunnelUrl = content.url.replace(/\/$/, '');
                
                const finalUrl = tunnelUrl + '/' + subPath + window.location.search;
                
                // 4. Cargar en iFrame
                const frame = document.getElementById('app-frame');
                const splash = document.getElementById('splash');
                const status = document.getElementById('status');
                
                status.innerText = 'ABRIENDO ' + id.title.toUpperCase() + '...';
                frame.src = finalUrl;
                
                frame.onload = () => {
                    setTimeout(() => {
                        splash.style.opacity = '0';
                        splash.style.visibility = 'hidden';
                        frame.style.display = 'block';
                    }, 600);
                };

            } catch (e) {
                console.error('Error:', e);
                window.location.replace('https://handheld-rent-powell-brother.trycloudflare.com');
            }
        }
        init();
    </script>
</body>
</html>
