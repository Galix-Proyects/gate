<!DOCTYPE html>
<html lang='es'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover'>
    <title>Symmetry Panel</title>
    <link rel='icon' type='image/png' href='logo.png'>
    <link rel='apple-touch-icon' href='logo.png'>
    <link href='https://fonts.googleapis.com/css2?family=Outfit:wght@400;900&display=swap' rel='stylesheet'>
    <style>
        :root { --accent: #22c55e; --bg: #020617; }
        body, html { margin: 0; padding: 0; background: var(--bg); color: #fff; font-family: 'Outfit', sans-serif; height: 100%; overflow-x: hidden; }
        .container { padding: 40px 20px; max-width: 800px; margin: 0 auto; text-align: center; }
        h1 { font-weight: 900; font-size: 2.5rem; margin-bottom: 5px; letter-spacing: -2px; }
        h1 span { color: var(--accent); }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 20px; margin-top: 40px; }
        .card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 28px; padding: 25px 15px; text-decoration: none; color: #fff; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); display: flex; flex-direction: column; align-items: center; backdrop-filter: blur(12px); }
        .card:hover { transform: scale(1.05); background: rgba(255,255,255,0.08); border-color: var(--accent); box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
        .card img { width: 70px; height: 70px; border-radius: 20px; margin-bottom: 15px; background: #000; padding: 5px; }
        .card span { font-weight: 900; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; }
        .status-bar { background: rgba(34, 197, 94, 0.1); color: var(--accent); padding: 8px 16px; border-radius: 50px; font-size: 0.6rem; font-weight: 900; display: inline-flex; align-items: center; letter-spacing: 2px; }
        .dot { width: 6px; height: 6px; background: var(--accent); border-radius: 50%; margin-right: 10px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(1.5); } 100% { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>
    <div class='container'>
        <div class='status-bar'><div class='dot'></div>TUNNEL ONLINE</div>
        <h1>SYMMETRY<span>GATE</span></h1>
        <div class='grid'>
            <a href='CorteUber/' class='card'>
                <img src='icons/CorteUber.png' onerror="this.src='logo.png'">
                <span>CorteUber</span>
            </a>
            <a href='GalixMovie/' class='card'>
                <img src='icons/GalixMovie.png' onerror="this.src='logo.png'">
                <span>GalixMovie</span>
            </a>
            <a href='PlanClase/' class='card'>
                <img src='icons/PlanClase.png' onerror="this.src='logo.png'">
                <span>PlanClase</span>
            </a>
            <a href='Purificadora/' class='card'>
                <img src='icons/Purificadora.png' onerror="this.src='logo.png'">
                <span>Purificadora</span>
            </a>
            <a href='appRoku/' class='card'>
                <img src='icons/appRoku.png' onerror="this.src='logo.png'">
                <span>appRoku</span>
            </a>
        </div>
        <div style='margin-top: 50px; font-size: 0.6rem; opacity: 0.3; letter-spacing: 5px;'>BOX SYMMETRY AI • 2026</div>
    </div>
</body>
</html>
