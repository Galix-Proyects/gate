<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | GalixMovie Secure Access</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: radial-gradient(circle at center, #1e293b 0%, #020617 100%);
            margin: 0;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 3rem 2rem;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .brand-logo {
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--accent);
            margin-bottom: 0.5rem;
            letter-spacing: -1px;
        }

        .login-subtitle {
            color: var(--text-dim);
            font-size: 0.9rem;
            margin-bottom: 2.5rem;
        }

        .input-group {
            position: relative;
            margin-bottom: 2rem;
        }

        .input-group ion-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-dim);
            font-size: 1.2rem;
            transition: color 0.3s;
        }

        .login-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px 15px 12px 45px;
            color: white;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            transition: all 0.3s;
            outline: none;
        }

        .login-input:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(225, 29, 72, 0.2);
        }

        .login-input:focus + ion-icon {
            color: var(--accent);
        }

        .login-btn {
            width: 100%;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
            box-shadow: 0 10px 20px rgba(225, 29, 72, 0.3);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .footer-text {
            margin-top: 2rem;
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="brand-logo">GALIX<span style="color:white;">MOVIE</span></div>
        <div class="login-subtitle">Command Center Access</div>
        
        <form id="loginForm">
            <div class="input-group">
                <ion-icon name="lock-closed-outline"></ion-icon>
                <input type="password" id="password" class="login-input" placeholder="Master Key" required autofocus>
            </div>
            
            <button type="submit" class="login-btn" id="loginBtn">
                <span>Ingresar al Sistema</span>
                <ion-icon name="arrow-forward-outline"></ion-icon>
            </button>
        </form>

        <div class="footer-text">Protected by Antigravity D.A.R.M.A</div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');
            const originalContent = btn.innerHTML;

            btn.disabled = true;
            btn.innerHTML = '<ion-icon name="sync-outline" class="spin-animation"></ion-icon> Verificando...';

            try {
                const formData = new FormData();
                formData.append('password', password);

                const res = await fetch('backend/login.php', {
                    method: 'POST',
                    body: formData
                });

                const data = await res.json();

                if (data.status === 'success') {
                    if (data.sid) {
                        localStorage.setItem('darma_sid', data.sid);
                    }
                    Swal.fire({
                        icon: 'success',
                        title: 'Acceso Concedido',
                        text: 'Redirigiendo al centro de comando...',
                        background: '#0f172a',
                        color: '#fff',
                        showConfirmButton: false,
                        timer: 1500,
                        timerProgressBar: true
                    }).then(() => {
                        window.location.href = 'admin.html';
                    });
                } else {
                    throw new Error(data.message || 'Error desconocido');
                }
            } catch (err) {
                Swal.fire({
                    icon: 'error',
                    title: 'Acceso Denegado',
                    text: 'La llave maestra es incorrecta.',
                    background: '#0f172a',
                    color: '#fff',
                    confirmButtonColor: '#e11d48'
                });
                btn.disabled = false;
                btn.innerHTML = originalContent;
            }
        });
    </script>
</body>
</html>
