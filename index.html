<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><title>Galix Gateway | Premium Experience</title><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="logo.png"><meta name="theme-color" content="#e11d48"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><style>body{background:#000;color:#fff;margin:0;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;overflow:hidden}.splash{text-align:center;transition:opacity 0.8s ease}.logo-container{width:200px;height:200px;margin:0 auto;position:relative;animation:netflixIntro 2.5s cubic-bezier(0.7, 0, 0.3, 1) forwards}.logo-img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 0 20px rgba(225,29,72,0.4))}@keyframes netflixIntro{0%{transform:scale(0.5);opacity:0;filter:blur(10px)}20%{opacity:1;filter:blur(0)}80%{transform:scale(1.1);opacity:1}100%{transform:scale(12);opacity:0}}.loader{width:40px;height:40px;border:3px solid rgba(225,29,72,0.2);border-top-color:#e11d48;border-radius:50%;animation:spin 1s linear infinite;margin:20px auto}@keyframes spin{to{transform:rotate(360deg)}}.status-text{font-size:0.8rem;letter-spacing:3px;color:#94a3b8;text-transform:uppercase;margin-top:20px;opacity:0;animation:fadeIn 1s 0.8s forwards}@keyframes fadeIn{to{opacity:1}}</style></head><body><div class="splash" id="splash"><div class="logo-container" id="logoContainer"><img src="logo.png" class="logo-img" alt="Galix Logo"></div><div class="loader" id="genericLoader" style="display:none"></div><div class="status-text" id="status">Sincronizando...</div></div><audio id="introSound" src="intro.mp3"></audio><script>const sound=document.getElementById("introSound");function playSfx(){sound.play().catch(()=>{console.log("Audio bloqueado")})}async function route(){const params=new URLSearchParams(window.location.search);const project=params.get("p");const isMovie=project==="GalixMovie";if(!isMovie){document.getElementById("logoContainer").style.display="none";document.getElementById("genericLoader").style.display="block"}else{document.body.onclick=playSfx;setTimeout(playSfx,200)}try{const res=await fetch("https://api.github.com/repos/Galix-Proyects/gate/contents/tunnel.json?t="+Date.now());const data=await res.json();const content=JSON.parse(atob(data.content));if(content.url){let finalUrl=content.url;if(project){finalUrl+=`/01_PROYECTOS/${project}/`}else{finalUrl+="/index.html"}setTimeout(()=>{window.location.href=finalUrl},isMovie?2500:1000)}}catch(e){document.getElementById("status").innerHTML="⚠️ Buscando señal..."}}route();</script></body></html>
