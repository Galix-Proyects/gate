<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Symmetry Gate | Acceso Instantáneo</title>
    <style>
        body { background: #020617; color: #f8fafc; font-family: 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
        .container { text-align: center; }
        .loader {
            width: 50px; height: 50px;
            border: 3px solid rgba(34, 197, 94, 0.1);
            border-top: 3px solid #22c55e;
            border-radius: 50%;
            margin: 0 auto 20px;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .status { font-size: 0.8rem; color: #22c55e; letter-spacing: 2px; font-weight: bold; }
    </style>
</head>
<body>
    <div class='container'>
        <div class='loader'></div>
        <div class='status'>VINCULANDO CON EL BÚNKER...</div>
    </div>

    <script>
        async function connect() {
            try {
                // 🚀 BYPASS DE CACHE: Consultar directamente a la API de GitHub
                const res = await fetch('https://api.github.com/repos/Galix-Proyects/gate/contents/tunnel.json?t=' + Date.now());
                const data = await res.json();
                
                // Decodificar Base64 de la API
                const content = JSON.parse(atob(data.content));
                const finalUrl = content.url + '/';
                
                // Redirección Instantánea
                setTimeout(() => {
                    window.location.href = finalUrl;
                }, 500);
            } catch (e) {
                // Fallback si la API falla: usar el link estático inyectado
                window.location.href = 'https://api.trycloudflare.com/';
            }
        }
        connect();
    </script>
</body>
</html>
