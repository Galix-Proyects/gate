<!DOCTYPE html>
<html lang='es'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover'>
    <title>Symmetry Panel</title>
    <link rel='icon' type='image/png' href='logo.png'>
    <link href='https://fonts.googleapis.com/css2?family=Outfit:wght@400;900&display=swap' rel='stylesheet'>
    <style>
        :root { --accent: #22c55e; --bg: #020617; }
        body, html { margin: 0; padding: 0; background: var(--bg); color: #fff; font-family: 'Outfit', sans-serif; text-align: center; }
        .container { padding: 40px 20px; max-width: 800px; margin: 0 auto; }
        h1 { font-weight: 900; font-size: 2.5rem; letter-spacing: -2px; }
        h1 span { color: var(--accent); }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 20px; margin-top: 40px; }
        .card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 28px; padding: 20px; text-decoration: none; color: #fff; transition: all 0.3s; display: flex; flex-direction: column; align-items: center; }
        .card:hover { transform: translateY(-5px); background: rgba(255,255,255,0.08); border-color: var(--accent); }
        .card img { width: 60px; height: 60px; border-radius: 15px; margin-bottom: 12px; }
        .card span { font-weight: 900; font-size: 0.75rem; text-transform: uppercase; }
        .status-bar { background: rgba(34, 197, 94, 0.1); color: var(--accent); padding: 8px 16px; border-radius: 50px; font-size: 0.6rem; font-weight: 900; display: inline-flex; align-items: center; }
        .dot { width: 6px; height: 6px; background: var(--accent); border-radius: 50%; margin-right: 10px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body>
    <div class='container'>
        <div class='status-bar'><div class='dot'></div>TUNNEL ONLINE</div>
        <h1>SYMMETRY<span>GATE</span></h1>
        <div class='grid'>
            <a href='CorteUber/' class='card'>
                <img src='icons/CorteUber.png' onerror="this.src='logo.png'" alt='CorteUber'>
                <span>CorteUber</span>
            </a>
            <a href='GalixMovie/' class='card'>
                <img src='icons/GalixMovie.png' onerror="this.src='logo.png'" alt='GalixMovie'>
                <span>GalixMovie</span>
            </a>
            <a href='PlanClase/' class='card'>
                <img src='icons/PlanClase.png' onerror="this.src='logo.png'" alt='PlanClase'>
                <span>PlanClase</span>
            </a>
            <a href='Purificadora/' class='card'>
                <img src='icons/Purificadora.png' onerror="this.src='logo.png'" alt='Purificadora'>
                <span>Purificadora</span>
            </a>
            <a href='appRoku/' class='card'>
                <img src='icons/appRoku.png' onerror="this.src='logo.png'" alt='appRoku'>
                <span>appRoku</span>
            </a>
            <a href='CloudManager/' class='card'>
                <img src='icons/CloudManager.png' onerror="this.src='logo.png'" alt='CloudManager'>
                <span>CloudManager</span>
            </a>
            <a href='remote-admin/' class='card'>
                <img src='icons/remote-admin.png' onerror="this.src='logo.png'" alt='remote-admin'>
                <span>remote-admin</span>
            </a>
        </div>
        <div style='margin-top: 50px; font-size: 0.6rem; opacity: 0.3;'>BOX SYMMETRY AI • 2026</div>
    </div>
</body>
</html>
