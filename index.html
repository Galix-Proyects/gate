<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Galix Gateway | Premium Experience</title><style>body{background:#000;color:#fff;margin:0;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;overflow:hidden}.splash{text-align:center;transition:opacity 0.8s ease}.logo-container{width:150px;height:150px;margin:0 auto;position:relative;animation:netflixIntro 2s cubic-bezier(0.7, 0, 0.3, 1) forwards}.logo-svg{width:100%;height:100%;filter:drop-shadow(0 0 15px rgba(225,29,72,0.6))}@keyframes netflixIntro{0%{transform:scale(0.5);opacity:0;filter:blur(10px)}20%{opacity:1;filter:blur(0)}80%{transform:scale(1.2);opacity:1}100%{transform:scale(15);opacity:0}}.loader{width:40px;height:40px;border:3px solid rgba(225,29,72,0.2);border-top-color:#e11d48;border-radius:50%;animation:spin 1s linear infinite;margin:20px auto}@keyframes spin{to{transform:rotate(360deg)}}.status-text{font-size:0.9rem;letter-spacing:3px;color:#94a3b8;text-transform:uppercase;margin-top:20px;opacity:0;animation:fadeIn 1s 0.5s forwards}@keyframes fadeIn{to{opacity:1}}</style></head><body><div class="splash" id="splash"><div class="logo-container" id="logoContainer"><svg class="logo-svg" viewBox="0 0 100 100"><defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#e11d48"/><stop offset="100%" style="stop-color:#4c0519"/></linearGradient></defs><circle cx="50" cy="50" r="48" fill="url(#g)"/><path d="M35 30 L75 50 L35 70 Z" fill="white"/></svg></div><div class="loader" id="genericLoader" style="display:none"></div><div class="status-text" id="status">Sincronizando...</div></div><script>function playTudum(){try{const ctx=new(window.AudioContext||window.webkitAudioContext)();const osc1=ctx.createOscillator();const osc2=ctx.createOscillator();const gain=ctx.createGain();osc1.type="square";osc2.type="square";osc1.frequency.setValueAtTime(40,ctx.currentTime);osc2.frequency.setValueAtTime(42,ctx.currentTime);gain.gain.setValueAtTime(0.5,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(0.01,ctx.currentTime+1.5);osc1.connect(gain);osc2.connect(gain);gain.connect(ctx.destination);osc1.start();osc2.start();setTimeout(()=>{osc1.frequency.exponentialRampToValueAtTime(80,ctx.currentTime+0.1);osc2.frequency.exponentialRampToValueAtTime(82,ctx.currentTime+0.1)},100);osc1.stop(ctx.currentTime+2);osc2.stop(ctx.currentTime+2)}catch(e){}}async function route(){const params=new URLSearchParams(window.location.search);const project=params.get("p");const isMovie=project==="GalixMovie";if(!isMovie){document.getElementById("logoContainer").style.display="none";document.getElementById("genericLoader").style.display="block"}else{document.body.onclick=playTudum;setTimeout(playTudum,100)}try{const res=await fetch("https://api.github.com/repos/Galix-Proyects/gate/contents/tunnel.json?t="+Date.now());const data=await res.json();const content=JSON.parse(atob(data.content));if(content.url){let finalUrl=content.url;if(project){finalUrl+=`/01_PROYECTOS/${project}/`}else{finalUrl+="/index.html"}setTimeout(()=>{window.location.href=finalUrl},isMovie?2200:1000)}}catch(e){document.getElementById("status").innerHTML="⚠️ Buscando señal..."}}route();</script></body></html>
