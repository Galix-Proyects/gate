<!DOCTYPE html>
    <html lang='es'>
    <head>
        <meta charset='utf-8'>
        <meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover'>
        <title>appRoku Pro</title>
        <meta name='mobile-web-app-capable' content='yes'>
        <meta name='apple-mobile-web-app-capable' content='yes'>
        <meta name='apple-mobile-web-app-status-bar-style' content='black-translucent'>
        <meta name='theme-color' content='#22c55e'>
        <link rel='manifest' href='manifest.json'>
        <link rel='apple-touch-icon' href='../icons/appRoku.png'>
        <link href='https://fonts.googleapis.com/css2?family=Outfit:wght@400;900&display=swap' rel='stylesheet'>
        <style>
            :root { --accent: #22c55e; --bg: #020617; }
            body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg); font-family: 'Outfit', sans-serif; }
            #splash { position: fixed; inset: 0; z-index: 9999; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.8s; }
            .loader { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.05); border-top: 3px solid var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 20px; }
            @keyframes spin { to { transform: rotate(360deg); } }
            .brand { font-size: 1.2rem; font-weight: 900; color: #fff; text-transform: uppercase; letter-spacing: 2px; }
            iframe { width: 100%; height: 100%; border: none; display: none; }
        </style>
    </head>
    <body>
        <div id='splash'>
            <div class='loader'></div>
            <div class='brand'>appRoku</div>
        </div>
        <iframe id='frame' allow='autoplay; camera; microphone; geolocation; encrypted-media; fullscreen; display-capture'></iframe>
        <script>
            async function load() {
                const status = document.querySelector('.status-bar');
                try {
                    // Usamos la API oficial de GitHub para bypass de cache (Alta fidelidad)
                    // Reemplazamos Galix-Proyects/gate dinámicamente si es necesario, pero aquí usamos los valores de la Box
                    const res = await fetch('https://api.github.com/repos/Galix-Proyects/gate/contents/tunnel.json?t=' + Date.now());
                    const data = await res.json();
                    
                    if (!data || !data.content) {
                        console.warn('API Limit? Intentando carga cruda...');
                        throw new Error('API_LIMIT');
                    }

                    const b64 = data.content.replace(/\n/g, '').replace(/\s/g, '');
                    const content = JSON.parse(atob(b64));
                    renderFrame(content.url);

                } catch(e) {
                    // FALLBACK: Si la API de GitHub falla, usamos el archivo estático (Caché de ~5-10 min)
                    try {
                        const res = await fetch('/gate/tunnel.json?t=' + Date.now());
                        const content = await res.json();
                        renderFrame(content.url);
                    } catch(err) {
                        status.style.background = '#ef4444';
                        status.innerHTML = '<div class="dot" style="background:#fff"></div> ERROR DE CONEXIÓN';
                        console.error('Fallo total de carga:', err);
                    }
                }
            }

            function renderFrame(tunnelUrl) {
                const frame = document.getElementById('frame');
                const cleanUrl = tunnelUrl.replace(/\/$/, '');
                
                // RUTEÓ DE SIMETRÍA TOTAL (Nginx root movido a /home/Proyectos)
                // Ahora las rutas del túnel coinciden 1:1 con la estructura del proyecto.
                const urlSimetrica = cleanUrl + '/appRoku/' + window.location.search;
                
                console.log('Intentando carga de simetría: ' + urlSimetrica);
                frame.src = urlSimetrica;
                
                frame.onload = () => {
                    document.getElementById('splash').style.opacity = '0';
                    setTimeout(() => {
                        document.getElementById('splash').style.display = 'none';
                        frame.style.display = 'block';
                    }, 800);
                };
            }
            load();
        </script>
    </body>
    </html>
